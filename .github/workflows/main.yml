name: Compilar IPA iOS sem assinatura

on:
  workflow_dispatch:

jobs:
  unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate --spec project.yml

      - name: Compilar arm64 para iPhone (sem assinar)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ChessTrainer.xcodeproj \
            -scheme ChessTrainer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Montar IPA nao assinado
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ChessTrainer.app"
          test -f "$APP/Info.plist"
          test -f "$APP/ChessTrainer"
          mkdir -p Payload
          ditto "$APP" "Payload/ChessTrainer.app"
          zip -qry ChessTrainer-unsigned.ipa Payload
          unzip -t ChessTrainer-unsigned.ipa
          ls -lh ChessTrainer-unsigned.ipa

      - name: Disponibilizar IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChessTrainer-unsigned-ipa
          path: ChessTrainer-unsigned.ipa
          if-no-files-found: error
